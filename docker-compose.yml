# MikroTik RouterOS (CHR) in Docker — ready to run, nothing to build.
#
# Pulls the published image and boots a pristine RouterOS CHR.
# First login: admin with a blank password (RouterOS makes you set a
# password on first login). This compose does NOT configure RouterOS
# for you — no VPN setup, no settings changed.
#
#   docker compose up -d
#
# RouterOS services keep their DEFAULT ports inside the container
# (WinBox 8291, API 8728, WebFig 80, SSH 22, SSTP 443). Only the
# host-side ports move out of the way: WebFig 808, SSH 322, SSTP 1010
# (the host's 443 usually belongs to a web stack / reverse proxy).
services:
  mikrotik:
    image: ghcr.io/ramezhany/mikrotik-chr-containerized:7.20.4
    container_name: mikrotik-chr
    privileged: true
    restart: unless-stopped
    environment:
      - QEMU_RAM=4096
      - QEMU_CPUS=4
      - DISK_SIZE=1G
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      # - /dev/kvm   # optional, Linux hosts only: much faster than emulation
    volumes:
      - mikrotik_data:/routeros/data
    ports:
      - "8291:8291" # WinBox
      - "8728:8728" # RouterOS API
      - "808:80"    # WebFig (HTTP)
      - "322:22"    # SSH
      - "1010:443"  # SSTP (RouterOS default 443 inside; host 1010)

volumes:
  mikrotik_data:
